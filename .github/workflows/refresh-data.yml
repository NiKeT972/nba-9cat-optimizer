name: refresh data and site

# Manual only. Verified Nov 2026: from GitHub-hosted runners stats.nba.com times out and
# cdn.nba.com answers 403 Forbidden, so this job cannot download data on GitHub's servers.
# The daily refresh runs on your own computer (scripts/refresh.ps1 + install-daily-task.ps1).
# Kept for a setup with an NBA_API_PROXY secret that can reach stats.nba.com.
# Downloads run with --strict, so a blocked run fails instead of re-publishing old data.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      NBA_API_PROXY: ${{ secrets.NBA_API_PROXY }}
      STREAMLIT_APP_URL: ${{ vars.STREAMLIT_APP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download data
        run: |
          python -m src.data.pipeline --force --strict   # fail loudly if the NBA blocks us
          python -m src.data.pipeline --season "$(python -c 'from src import config; print(config.PRIOR_SEASON)')"
      - name: Backtest (only when the report is missing)
        run: |
          season=$(python -c 'from src import config; print(config.BACKTEST_SEASON)')
          if [ ! -f "reports/backtest_${season}.csv" ]; then
            python -m src.data.pipeline --season "$(python -c "from src import config; print(config.previous_season('${season}'))")" || true
            python -m src.projections.backtest --season "${season}"
          fi
      - run: python -m app.static_site
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw reports public
          git diff --cached --quiet || git commit -m "Refresh NBA data and site ($(date -u +%F))"
          git push
