[project]
name = "nba-9cat-optimizer"
version = "0.1.0"
description = "Projections, z-score valuation and Monte Carlo matchup simulation for 9-category H2H fantasy basketball."
requires-python = ">=3.11"
dependencies = [
  "nba_api>=1.10",
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=15",
  "scikit-learn>=1.4",
  "streamlit>=1.38",
  "plotly>=5.22",
  "python-dotenv>=1.0",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
